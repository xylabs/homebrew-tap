name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update xy formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          TARBALL_URL="https://registry.npmjs.org/@xylabs/toolchain/-/toolchain-${VERSION}.tgz"
          SHA256=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)
          sed -i "s|url \"https://registry.npmjs.org/@xylabs/toolchain/-/toolchain-.*\.tgz\"|url \"${TARBALL_URL}\"|" Formula/xy.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/xy.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/xy.rb
          git commit -m "xy ${VERSION}"
          git push
